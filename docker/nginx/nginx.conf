# =============================================================================
# 智能知识中台 - Nginx 反向代理配置
# 作用：
#   1. 托管前端静态文件（React SPA 构建产物）
#   2. 反向代理 /api 请求到后端 FastAPI 服务（负载均衡 api-1 + api-2）
#   3. 健康检查 /health 直接代理到后端
#   4. gzip 压缩静态资源，减小传输体积
# =============================================================================

# -----------------------------------------------------------------------------
# 上游服务定义：后端 API 集群（负载均衡）
# -----------------------------------------------------------------------------
# 为什么用 upstream 而非直接 proxy_pass http://api-1:8000？
#   upstream 支持多后端实例负载均衡，单实例故障时自动剔除（默认轮询策略）。
#   配合 docker-compose 中 api-1 + api-2 两个副本，实现水平扩展与高可用。
upstream api_backend {
    # api-1 实例：docker-compose 中定义的后端服务 1
    server api-1:8000;
    # api-2 实例：docker-compose 中定义的后端服务 2
    server api-2:8000;
    # 保持长连接 32 个，减少 TCP 握手开销
    keepalive 32;
}

# -----------------------------------------------------------------------------
# 主服务配置：监听 80 端口
# -----------------------------------------------------------------------------
server {
    # 监听 80 端口（HTTP）
    # 生产环境如需 HTTPS，取消下方 443 行注释并配置 ssl 证书：
    #   listen 443 ssl;
    #   ssl_certificate     /etc/nginx/ssl/server.crt;
    #   ssl_certificate_key /etc/nginx/ssl/server.key;
    #   ssl_protocols TLSv1.2 TLSv1.3;
    #   ssl_ciphers HIGH:!aNULL:!MD5;
    listen 80;
    # 监听 IPv6（可选）
    listen [::]:80;

    # 服务名：生产环境替换为实际域名
    server_name _;

    # -----------------------------------------------------------------------------
    # 全局参数
    # -----------------------------------------------------------------------------
    # 客户端请求体最大 20MB（支持文件上传：文档/图片等）
    # 超过此大小返回 413 Request Entity Too Large
    client_max_body_size 20m;

    # -----------------------------------------------------------------------------
    # gzip 压缩配置：压缩静态资源，减小传输体积
    # -----------------------------------------------------------------------------
    gzip on;
    # 仅对大于 1KB 的响应压缩（小文件压缩收益低，反而增加 CPU 开销）
    gzip_min_length 1024;
    # 压缩级别 4（1-9，越高压缩率越好但 CPU 占用越高，4 为平衡点）
    gzip_comp_level 4;
    # 压缩的 MIME 类型：文本类资源才压缩，图片/视频已压缩无需重复
    gzip_types text/plain text/css text/javascript application/javascript application/json application/xml;
    # 在响应头添加 Vary: Accept-Encoding，避免 CDN 缓存错乱
    gzip_vary on;

    # -----------------------------------------------------------------------------
    # 前端静态文件：React SPA 构建产物
    # -----------------------------------------------------------------------------
    # root 指向 nginx 容器内前端构建产物目录
    # 由 frontend/Dockerfile 将 dist 复制到 /usr/share/nginx/html
    root /usr/share/nginx/html;
    # 默认首页文件
    index index.html;

    # SPA 路由支持：所有未匹配静态文件的请求回退到 index.html
    # 为什么需要 try_files？
    #   React Router 使用 History 模式时，URL 如 /projects/123 不对应实际文件。
    #   若不回退，刷新该 URL 会返回 404。try_files 先尝试匹配实际文件，
    #   匹配不到时回退到 /index.html，由前端路由接管。
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源缓存：带 hash 的文件名可长期缓存
    # Vite 构建产物如 assets/index-abc123.js 文件名含内容 hash，
    # 内容变更时 hash 变化，可安全设置长缓存
    location ~* \.(?:js|css|woff2?|ttf|eot|png|jpg|jpeg|gif|svg|ico)$ {
        # 1 年缓存（文件名含 hash，内容变更时 hash 自动更新）
        expires 1y;
        # 添加不可变标记，浏览器不再发起条件请求
        add_header Cache-Control "public, immutable";
        # try_files 仍然回退到 index.html（避免删除文件后 404）
        try_files $uri /index.html;
    }

    # -----------------------------------------------------------------------------
    # 健康检查接口：直接代理到后端
    # -----------------------------------------------------------------------------
    # /health 是后端存活探针，Nginx 自身也通过此接口做容器健康检查
    location = /health {
        proxy_pass http://api_backend/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # -----------------------------------------------------------------------------
    # API 反向代理：/api 开头的请求转发到后端 FastAPI 集群
    # -----------------------------------------------------------------------------
    location /api {
        # 代理到 upstream api_backend（负载均衡 api-1 + api-2）
        proxy_pass http://api_backend;

        # 使用 HTTP/1.1 长连接，配合 upstream keepalive 复用连接
        proxy_http_version 1.1;
        # 设置 Connection 头为空，启用 keepalive（默认 close 会关闭连接）
        proxy_set_header Connection "";

        # 转发客户端真实信息到后端
        # Host：原始请求的 Host 头，后端可能用于虚拟主机路由
        proxy_set_header Host $host;
        # X-Real-IP：客户端真实 IP（非 Nginx 容器 IP）
        proxy_set_header X-Real-IP $remote_addr;
        # X-Forwarded-For：客户端 IP 链路（多层代理时记录完整转发链）
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # X-Forwarded-Proto：原始协议（http/https），后端用于生成正确的跳转 URL
        proxy_set_header X-Forwarded-Proto $scheme;

        # 超时设置（研究接口可能较慢，需放宽）
        # proxy_connect_timeout：与后端建立连接的超时时间
        proxy_connect_timeout 10s;
        # proxy_send_timeout：向后端发送请求体的超时时间
        proxy_send_timeout 60s;
        # proxy_read_timeout：读取后端响应的超时时间
        # 研究接口（/research/run）可能调用 LLM + 联网搜索，耗时较长，
        # 设为 60s 避免长任务被 Nginx 提前断开（默认 60s，此处显式声明）
        proxy_read_timeout 60s;

        # 文件上传大小限制（与 client_max_body_size 一致）
        proxy_request_buffering off;
    }

    # -----------------------------------------------------------------------------
    # 错误页面：后端不可用时返回友好提示
    # -----------------------------------------------------------------------------
    # 502 Bad Gateway：后端服务全部不可用
    # 504 Gateway Timeout：后端响应超时
    error_page 502 503 504 /50x.html;
    location = /50x.html {
        # 返回简单的错误提示页面（可替换为自定义静态页）
        default_type text/html;
        return 502 '<!DOCTYPE html><html><head><meta charset="utf-8"><title>服务暂不可用</title></head><body><h1>服务暂时不可用</h1><p>系统正在维护中，请稍后重试。</p></body></html>';
    }
}
