[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "knowledge-hub-backend"
version = "1.0.0"
description = "智能知识中台后端服务"
requires-python = ">=3.12"
authors = [{ name = "Knowledge Hub Team" }]
license = { text = "Proprietary" }

# 运行时依赖：覆盖 spec.md 与 tasks.md Task 2 要求的全部技术栈
dependencies = [
  # Web 框架与服务
  "fastapi>=0.110.0",
  "uvicorn[standard]>=0.27.0",
  "starlette>=0.36.0",
  # 数据校验与配置
  "pydantic>=2.6.0",
  "pydantic-settings>=2.2.0",
  # ORM 与数据库
  "SQLAlchemy[asyncio]>=2.0.27",
  "asyncpg>=0.29.0",
  "alembic>=1.13.0",
  "pgvector>=0.2.5",
  # 缓存、任务队列
  "redis>=5.0.0",
  "celery>=5.3.6",
  # HTTP 客户端
  "httpx>=0.27.0",
  # 文档解析
  "PyMuPDF>=1.24.0",
  "python-docx>=1.1.0",
  "trafilatura>=1.9.0",
  "beautifulsoup4>=4.12.3",
  # 密钥派生与安全
  "argon2-cffi>=23.1.0",
  # 工具库
  "python-multipart>=0.0.9",
  "tenacity>=8.2.3",
  "orjson>=3.10.0",
  "structlog>=24.1.0",
  # 定时任务调度：cron 表达式解析与下次运行时间计算（Task 18）
  "croniter>=2.0.5",
]

[project.optional-dependencies]
# 开发与测试依赖
dev = [
  "ruff>=0.3.0",
  "mypy>=1.9.0",
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.5",
  "pytest-cov>=4.1.0",
  "httpx>=0.27.0",
  "types-redis>=4.6.0",
  "types-beautifulsoup4>=4.12.0",
]

[project.urls]
Homepage = "https://example.com/knowledge-hub"

# ---------------------------------------------------------------------------
# setuptools 配置：将 app 包纳入安装范围
# ---------------------------------------------------------------------------
[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["tests*"]

# ---------------------------------------------------------------------------
# Ruff：格式化与 Lint
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM"]
ignore = [
  # 允许未注解的 self/cls（FastAPI 依赖中常见）
  "B008",  # Do not perform function call in argument defaults（FastAPI Depends 必需）
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

# ---------------------------------------------------------------------------
# mypy：严格类型检查（可选启用）
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = false
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = false
ignore_missing_imports = true
exclude = ["alembic/versions", "build", "dist"]

# ---------------------------------------------------------------------------
# pytest：异步测试自动模式
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
  "-ra",
  "--strict-markers",
  "--tb=short",
]
