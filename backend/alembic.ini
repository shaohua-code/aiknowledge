# Alembic migration config for Knowledge Hub backend
# Initialized by Task 4.5 (alembic init alembic)

[alembic]
# Migration scripts directory, relative to this file
script_location = alembic

# File template for revision scripts
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

# Database URL placeholder: actual value is read from app.core.config.settings in env.py
# Keep a sync driver placeholder here to avoid alembic CLI parse errors
sqlalchemy.url = postgresql://postgres:postgres@localhost:5432/knowledge_hub

[post_write_hooks]
# Auto-format revision scripts with ruff after generation
hooks = ruff
ruff.type = console_scripts
ruff.entrypoint = ruff
ruff.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
